services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: simple-notes-image
    container_name: simple-notes
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:123456@postgres:5432/backend_learning"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.1-alpine
    container_name: simple-notes-postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: backend_learning
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
