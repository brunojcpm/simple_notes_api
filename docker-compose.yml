services:
  api:
    build: .
    container_name: simple-notes
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: "postgresql://postgres:123456@postgres:5432/backend_learning"
      PORT: 3000
    depends_on:
      - postgres

  postgres:
    image: postgres:17.1-alpine
    container_name: simple-notes-postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: backend_learning
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
